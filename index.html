<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Compra Voz</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f2f5; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        input { padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        button { padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-voice { background: #e74c3c; color: white; font-size: 1.2em; }
        .btn-voice.listening { background: #ffbd2e; color: black; }
        .item { background: white; padding: 10px; margin-top: 5px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; }
        /* Consola de depuración para ver qué pasa en el móvil */
        #debugLog { background: #333; color: #0f0; padding: 10px; font-family: monospace; font-size: 10px; margin-top: 20px; border-radius: 5px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>🛒 Lista con Voz</h2>
    
    <div class="controls">
        <button id="voiceBtn" class="btn-voice">🎤 PULSAR PARA HABLAR</button>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <input type="text" id="itemInput" placeholder="Escribe aquí..." style="flex:1">
            <button onclick="addItem()" style="background:#3498db; color:white;">OK</button>
        </div>
    </div>

    <div id="listContainer" style="margin-top:20px;"></div>
    
    <div id="debugLog">Estado: Esperando clic...</div>

    <script>
        const debug = document.getElementById('debugLog');
        function log(msg) { debug.innerHTML += "<br>> " + msg; debug.scrollTop = debug.scrollHeight; }

        let shoppingList = JSON.parse(localStorage.getItem('myShoppingList')) || [];

        const voiceBtn = document.getElementById('voiceBtn');

        voiceBtn.addEventListener('click', () => {
            log("Botón pulsado. Iniciando SpeechRecognition...");
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                log("ERROR: Tu navegador no soporta SpeechRecognition.");
                alert("Navegador no compatible.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            
            recognition.onstart = () => {
                log("Micro activado: Escuchando...");
                voiceBtn.classList.add('listening');
                voiceBtn.innerText = "🔴 ESCUCHANDO...";
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                log("Texto recibido: " + texto);
                document.getElementById('itemInput').value = texto;
                addItem();
            };

            recognition.onerror = (e) => {
                log("ERROR de micro: " + e.error);
                alert("Error: " + e.error);
            };

            recognition.onend = () => {
                log("Micro cerrado.");
                voiceBtn.classList.remove('listening');
                voiceBtn.innerText = "🎤 PULSAR PARA HABLAR";
            };

            try {
                recognition.start();
            } catch (err) {
                log("Excepción al iniciar: " + err.message);
            }
        });

        function addItem() {
            const input = document.getElementById('itemInput');
            if (!input.value.trim()) return;
            shoppingList.push({ name: input.value, checked: false });
            input.value = '';
            renderList();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            shoppingList.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span>${item.name}</span><button onclick="removeItem(${idx})">✕</button>`;
                container.appendChild(div);
            });
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
        }

        function removeItem(index) {
            shoppingList.splice(index, 1);
            renderList();
        }

        renderList();
    </script>
</body>
</html>
