<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compra por Voz</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #f0f2f5; color: #1a1a1a; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .input-row { display: flex; gap: 8px; }
        input { flex: 1; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: #3498db; }
        
        button { padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-add { background: #3498db; color: white; flex: 0.3; }
        .btn-voice { background: #e74c3c; color: white; width: 100%; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-voice.listening { background: #ffbd2e; animation: pulse 1.5s infinite; color: #000; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .store-section { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .store-title { font-weight: 800; color: #2980b9; border-bottom: 2px solid #f1f1f1; padding-bottom: 5px; margin-bottom: 12px; text-transform: uppercase; font-size: 0.85em; }
        .item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .item:last-child { border-bottom: none; }
        .item span { flex: 1; margin-left: 12px; font-size: 1.05em; }
        .delete-btn { color: #ccc; padding: 5px 10px; font-size: 1.2em; }
        .check { width: 22px; height: 22px; accent-color: #27ae60; }
        .clear-all { background: none; color: #95a5a6; font-size: 0.9em; text-decoration: underline; margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

    <h2>🛒 Mi Compra Inteligente</h2>
    
    <div class="controls">
        <button id="voiceBtn" class="btn-voice" onclick="startVoice()">
            🎤 Pulsar para dictar
        </button>
        <div class="input-row">
            <input type="text" id="itemInput" placeholder="O escribe aquí...">
            <button class="btn-add" onclick="addItem()">OK</button>
        </div>
    </div>

    <div id="listContainer"></div>
    <button class="clear-all" onclick="clearChecked()">Borrar productos comprados</button>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('myShoppingList')) || [
            { name: "Café", store: "Básicos", checked: false },
            { name: "Leche (sin azúcar)", store: "Básicos", checked: false },
            { name: "Pan Integral", store: "Básicos", checked: false },
            { name: "Aceite de Oliva VE", store: "Básicos", checked: false }
        ];

        // Configuración de Reconocimiento de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.lang = 'es-ES';
            recognition.interimResults = false;

            recognition.onstart = () => {
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceBtn').innerText = "🔴 Escuchando...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('itemInput').value = transcript;
                addItem();
            };

            recognition.onend = () => {
                document.getElementById('voiceBtn').classList.remove('listening');
                document.getElementById('voiceBtn').innerText = "🎤 Pulsar para dictar";
            };
        }

        function startVoice() {
            if (!recognition) {
                alert("Tu navegador no soporta dictado por voz.");
                return;
            }
            recognition.start();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            
            const grouped = shoppingList.reduce((acc, item) => {
                if (!acc[item.store]) acc[item.store] = [];
                acc[item.store].push(item);
                return acc;
            }, {});

            for (const store in grouped) {
                const section = document.createElement('div');
                section.className = 'store-section';
                section.innerHTML = `<div class="store-title">${store}</div>`;
                
                grouped[store].forEach((item) => {
                    const itemIdx = shoppingList.indexOf(item);
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <input type="checkbox" class="check" ${item.checked ? 'checked' : ''} onclick="toggleCheck(${itemIdx})">
                        <span style="${item.checked ? 'text-decoration: line-through; color: #bdc3c7;' : ''}">${item.name}</span>
                        <div class="delete-btn" onclick="removeItem(${itemIdx})">✕</div>
                    `;
                    section.appendChild(div);
                });
                container.appendChild(section);
            }
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const val = input.value.trim();
            if (!val) return;

            let name = val.charAt(0).toUpperCase() + val.slice(1);
            let store = "General";

            if (val.toLowerCase().includes(" en ")) {
                const parts = val.split(/ en /i);
                name = parts[0].trim();
                store = parts[1].trim().toUpperCase();
            }

            shoppingList.push({ name, store, checked: false });
            input.value = '';
            renderList();
        }

        function toggleCheck(index) {
            shoppingList[index].checked = !shoppingList[index].checked;
            renderList();
        }

        function removeItem(index) {
            shoppingList.splice(index, 1);
            renderList();
        }

        function clearChecked() {
            shoppingList = shoppingList.filter(item => !item.checked);
            renderList();
        }

        renderList();
    </script>
</body>
</html>
