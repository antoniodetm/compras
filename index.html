<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista de Compra - Test Forzado</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --bg: #f2f2f7; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: var(--bg); text-align: left; }
        
        .btn-voice { 
            width: 100%; padding: 20px; background: var(--danger); color: white; 
            border: none; border-radius: 15px; font-size: 1.2rem; font-weight: bold;
            margin-bottom: 10px; touch-action: manipulation;
        }

        .input-row { display: flex; gap: 5px; margin-bottom: 10px; }
        input { flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 1rem; }
        .btn-add { background: var(--primary); color: white; border: none; border-radius: 10px; width: 60px; }

        .item { 
            background: white; margin-bottom: 5px; padding: 12px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: flex-start; gap: 10px;
        }
        .item-text { flex: 1; text-align: left; font-size: 1.1rem; }
        
        /* Consola de errores para diagnóstico */
        #debug-console { 
            margin-top: 20px; padding: 10px; background: #ffeeee; 
            border: 1px solid #ffcccc; color: red; font-size: 0.8rem; border-radius: 5px;
        }
    </style>
</head>
<body>

    <button id="voiceBtn" class="btn-voice">🎤 PULSAR PARA HABLAR</button>
    
    <div class="input-row">
        <input type="text" id="itemInput" placeholder="Escribe o dicta aquí...">
        <button class="btn-add" onclick="addItem()">OK</button>
    </div>

    <div id="listContainer"></div>
    
    <div id="debug-console">Estado: Esperando interacción...</div>

<script>
    const btn = document.getElementById('voiceBtn');
    const debug = document.getElementById('debug-console');
    let recognition = null;

    function log(msg) { debug.innerText = "Estado: " + msg; }

    try {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
            log("ERROR: Tu navegador no soporta SpeechRecognition.");
        } else {
            recognition = new Speech();
            recognition.lang = 'es-ES';
            recognition.continuous = false;

            recognition.onstart = () => {
                log("Escuchando... hable ahora.");
                btn.style.background = "black";
                btn.innerText = "🔴 ESCUCHANDO...";
            };

            recognition.onresult = (e) => {
                const result = e.results[0][0].transcript;
                document.getElementById('itemInput').value = result;
                log("Recibido: " + result);
                addItem();
            };

            recognition.onerror = (e) => {
                log("ERROR de reconocimiento: " + e.error);
                stopUI();
            };

            recognition.onend = () => {
                log("Micrófono cerrado.");
                stopUI();
            };
        }
    } catch (e) {
        log("Error crítico: " + e.message);
    }

    function stopUI() {
        btn.style.background = "var(--danger)";
        btn.innerText = "🎤 PULSAR PARA HABLAR";
    }

    // Usamos pointerdown para que sea más sensible que el click
    btn.addEventListener('pointerdown', () => {
        if (!recognition) return;
        try {
            recognition.start();
        } catch (e) {
            recognition.stop();
            log("Reiniciando...");
        }
    });

    let shoppingList = JSON.parse(localStorage.getItem('myList')) || [];

    function render() {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        shoppingList.forEach((item, i) => {
            container.innerHTML += `
                <div class="item">
                    <input type="checkbox" onclick="toggle(${i})">
                    <span class="item-text">${item}</span>
                    <span onclick="remove(${i})">✕</span>
                </div>`;
        });
        localStorage.setItem('myList', JSON.stringify(shoppingList));
    }

    function addItem() {
        const input = document.getElementById('itemInput');
        if (input.value.trim()) {
            shoppingList.push(input.value.trim());
            input.value = '';
            render();
        }
    }

    function remove(i) { shoppingList.splice(i, 1); render(); }
    render();
</script>
</body>
</html>
